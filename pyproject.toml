[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biony"
version = "0.1.0"
description = "Protótipo visual do mascote Biony"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "fastapi[standard]>=0.115,<1",
    "openai>=1,<2",
    "openwakeword>=0.6,<1",
]

[tool.setuptools]
packages = ["app", "core", "face"]
