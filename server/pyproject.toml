[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biony"
version = "0.2.0"
description = "Servidor do Biony: assistente pessoal por voz e texto"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "apscheduler>=3.10,<4",
    "tuya-connector-python>=0.1.2,<0.2",
]

[project.optional-dependencies]
voz = [
    "faster-whisper>=1.2,<2",
    # O faster-whisper 1.2 quebra com o PyAV 19 (parâmetro metadata_errors removido).
    "av>=12,<19",
    "piper-tts>=1.3,<2",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["biony*"]

[tool.setuptools.package-data]
# A PWA vai junto com o pacote (é servida pelo próprio servidor).
biony = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
