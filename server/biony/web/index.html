<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Biony</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <main id="login" class="login" hidden>
    <img src="icon-192.png" alt="" class="login-logo">
    <h1>Biony</h1>
    <form id="login-form">
      <input id="login-password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- Conversa -->
  <main id="chat" class="chat" hidden>
    <header class="top">
      <div class="title">
        <span id="status-dot" class="dot" title="Status"></span>
        <strong>Biony</strong>
        <small id="status-text"></small>
      </div>
      <div class="actions">
        <button id="face-toggle" class="icon" title="Modo rosto (tela cheia)" aria-pressed="false">🙂</button>
        <button id="speak-toggle" class="icon" title="Responder falando (quando você fala)" aria-pressed="true">🔊</button>
        <button id="new-chat" class="icon" title="Nova conversa">＋</button>
        <button id="logout" class="icon" title="Sair">⎋</button>
      </div>
    </header>

    <section id="face-panel" class="face-panel">
      <canvas id="face" aria-label="Rosto do Biony"></canvas>
      <p id="caption" class="caption" aria-live="polite"></p>
    </section>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div id="confirm" class="confirm" hidden>
      <button data-answer="sim" class="yes">Sim</button>
      <button data-answer="não" class="no">Não</button>
    </div>

    <form id="composer" class="composer">
      <textarea id="text" rows="1" placeholder="Fale ou digite…" enterkeyhint="send"></textarea>
      <button id="mic" type="button" class="round mic" title="Falar (toque para começar e para enviar)">🎙️</button>
      <button id="send" type="submit" class="round send" title="Enviar">➤</button>
    </form>
  </main>

  <script src="face.js"></script>
  <script src="app.js"></script>
</body>
</html>
