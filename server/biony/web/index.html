<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0e0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Biony</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ícones (traço de 1,75 px, estilo linha). Usados com <svg><use href="#i-..."/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/></symbol>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-face" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="5"/><path d="M9 10v3M15 10v3"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6 9.5V20h12V9.5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M8 5v14M16 5v14"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></symbol>
    </defs>
  </svg>

  <!-- Login -->
  <main id="login" class="login" hidden>
    <div class="orb orb-lg" aria-hidden="true"></div>
    <h1>Biony</h1>
    <p class="login-sub">Entre para continuar</p>
    <form id="login-form">
      <input id="login-password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit" class="primary">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <!-- Conversa -->
  <main id="chat" class="chat" hidden>
    <header class="top">
      <div class="title">
        <span class="brand">Biony</span>
        <span id="status-dot" class="dot" title="Status"></span>
        <small id="status-text"></small>
      </div>
      <div class="actions">
        <button id="new-chat" class="icon" title="Nova conversa" aria-label="Nova conversa"><svg><use href="#i-new"/></svg></button>
        <button id="menu-open" class="icon" title="Mais opções" aria-label="Mais opções" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
      </div>
      <div id="menu" class="menu" role="menu" hidden>
        <button id="agenda-open" role="menuitem"><svg><use href="#i-calendar"/></svg><span>Agenda</span></button>
        <button id="face-toggle" role="menuitemcheckbox" aria-checked="false"><svg><use href="#i-face"/></svg><span>Rosto em tela cheia</span><i class="switch"></i></button>
        <button id="speak-toggle" role="menuitemcheckbox" aria-checked="true"><svg><use href="#i-volume"/></svg><span>Respostas faladas</span><i class="switch"></i></button>
        <button id="app-settings" role="menuitem" hidden><svg><use href="#i-gear"/></svg><span>Configurações do app</span></button>
        <hr>
        <button id="logout" role="menuitem" class="danger"><svg><use href="#i-logout"/></svg><span>Sair</span></button>
      </div>
    </header>

    <section id="face-panel" class="face-panel">
      <canvas id="face" aria-label="Rosto do Biony"></canvas>
      <p id="caption" class="caption" aria-live="polite"></p>
    </section>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div class="bottom">
      <div id="confirm" class="confirm" hidden>
        <button data-answer="sim" class="yes">Confirmar</button>
        <button data-answer="não" class="no">Cancelar</button>
      </div>
      <form id="composer" class="composer">
        <textarea id="text" rows="1" placeholder="Pergunte ao Biony" enterkeyhint="send" aria-label="Mensagem"></textarea>
        <button id="mic" type="button" class="round mic" title="Conversar por voz: toque, fale e faça uma pausa; toque de novo para encerrar" aria-label="Conversar por voz"><svg class="when-idle"><use href="#i-mic"/></svg><svg class="when-recording"><use href="#i-stop"/></svg></button>
        <button id="send" type="submit" class="round send" title="Enviar" aria-label="Enviar"><svg><use href="#i-send"/></svg></button>
      </form>
    </div>
  </main>

  <!-- Agenda -->
  <main id="agenda" class="agenda" hidden>
    <header class="top">
      <div class="title">
        <button id="agenda-close" class="icon" title="Voltar" aria-label="Voltar para a conversa"><svg><use href="#i-back"/></svg></button>
        <span class="brand">Agenda</span>
      </div>
    </header>
    <div class="agenda-body">
      <form id="task-form" class="task-form">
        <input id="task-title" type="text" placeholder="Nova tarefa" maxlength="200" required>
        <input id="task-due" type="datetime-local" title="Prazo (opcional)" aria-label="Prazo (opcional)">
        <button type="submit" class="round send" title="Adicionar" aria-label="Adicionar tarefa"><svg><use href="#i-plus"/></svg></button>
      </form>
      <p id="agenda-error" class="error" role="alert"></p>
      <h2>Tarefas</h2>
      <ul id="task-list" class="agenda-list"></ul>
      <h2>Lembretes</h2>
      <ul id="reminder-list" class="agenda-list"></ul>
    </div>
  </main>

  <script src="face.js"></script>
  <script src="vad.js"></script>
  <script src="app.js"></script>
</body>
</html>
