# Uso (no Debian, dentro da pasta deploy/):
#   docker compose up -d --build
#   docker compose logs -f biony
# Porta no servidor: 8420 por padrão. Para trocar: BIONY_PORT=9000 docker compose up -d
services:
  biony:
    build: ../server
    container_name: biony
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "${BIONY_PORT:-8420}:8000"
    volumes:
      - biony-data:/data

volumes:
  biony-data:
