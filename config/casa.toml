# O que o Biony pode controlar no Home Assistant.
# Só o que estiver aqui fica visível para o LLM (é a lista de permissão).
# Depois de editar, reinicie o Biony:  docker compose restart biony

# ---------------------------------------------------------------- dispositivos
# [dispositivos.<id>]   <id> é como o Biony chama o aparelho por dentro
#   nome     = como você fala dele
#   entidade = entidade do HA (light.* vira "luz"; switch.*/input_boolean.* vira "interruptor")
#
# Aparelho por infravermelho (tipo = "ar_ir"):
#   ligar / desligar = cena ou script do HA que manda o sinal
#   sinal_alterna    = true se ligar e desligar mandam o MESMO sinal (botão único de power).
#                      Nesse caso o Biony guarda o estado presumido e não manda o sinal
#                      se o aparelho já estiver no estado pedido.
#   observacao = dica para o Biony entender o aparelho (vale para qualquer tipo)
#   confirmar_desligar = true  → "desligar" sempre pede confirmação (ex.: filtro do PC)
#   [dispositivos.<id>.modos]   opcional: "nome do modo" = "scene.x"
#                      Cena que liga o aparelho já num ajuste ("24 graus", "dormir"...).

[dispositivos.fita_led]
nome = "fita LED do teto do quarto"
entidade = "light.quarto_led_do_teto"

[dispositivos.setup]
nome = "setup do PC (filtro de linha: PC, monitor e TV)"
entidade = "switch.ews_305_socket_1"
# Desligar o filtro corta a energia do PC na hora: sempre pede confirmação.
confirmar_desligar = true
observacao = "Para LIGAR ou DESLIGAR O PC use pc_ligar / pc_desligar (desligam o Windows direito antes de cortar a energia). Só use este aparelho direto se o Lucas pedir explicitamente para cortar a energia do filtro."

[dispositivos.ar]
nome = "ar-condicionado do quarto"
tipo = "ar_ir"
# scene.ligar se chama "Temp24C" no app: liga já em 24 °C.
ligar = "scene.ligar"
desligar = "scene.desligar_ar"
# Cada cena manda o próprio sinal (ligar só liga, desligar só desliga).
sinal_alterna = false
observacao = """Só tem estes modos: 26 graus é o mais quente e o modo dormir (22 graus e turbo) é o mais frio. Se o Lucas estiver com frio, suba a temperatura; se já estiver no 26, diga que esse é o máximo."""

[dispositivos.ar.modos]
"24 graus" = "scene.ligar"
"26 graus" = "scene.temp26c"
"dormir (22 graus e turbo)" = "scene.dormir"

# --------------------------------------------------------------------- rotinas
# [rotinas.<id>]
#   descricao = quando usar (o LLM lê isso para decidir)
#   passos    = lista executada em ordem. Cada passo é:
#     { dispositivo = "<id>", acao = "ligar" | "desligar", brilho = 1-100, cor = [R, G, B] }
#     { dispositivo = "<id>", acao = "ligar", modo = "<nome do modo>" }
#     { entidade = "scene.x" | "script.x" }   ← ativa uma cena/script do HA
#     { pc = "ligar" | "desligar" }           ← liga/desliga o PC pelo agente
#                                               (desligar: Windows primeiro, depois o filtro;
#                                                a rotina pede confirmação)

[rotinas.chegando]
descricao = "Lucas está a caminho de casa (\"estou chegando\", \"tô chegando\", \"tô indo pra casa\")"
passos = [
  { dispositivo = "ar", acao = "ligar", modo = "24 graus" },
]

[rotinas.cheguei]
descricao = "Lucas chegou no quarto (\"cheguei\", \"tô em casa\")"
passos = [
  { dispositivo = "ar", acao = "ligar", modo = "24 graus" },
  { pc = "ligar" },
  { dispositivo = "fita_led", acao = "ligar" },
]

[rotinas.dormir]
descricao = "Lucas vai dormir. Rode SEMPRE que ele disser \"vou dormir\" ou \"boa noite\" (mesmo que pareça só um cumprimento: para o Biony, \"boa noite\" é a despedida antes de dormir)."
passos = [
  { pc = "desligar" },
  { dispositivo = "fita_led", acao = "desligar" },
  { dispositivo = "ar", acao = "ligar", modo = "dormir (22 graus e turbo)" },
]

[rotinas.sai]
descricao = "Lucas está saindo do quarto (\"tô saindo\", \"fui\")"
passos = [
  { dispositivo = "fita_led", acao = "desligar" },
  { dispositivo = "ar", acao = "desligar" },
]
